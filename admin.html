<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración Roma Mates</title><style>*{box-sizing:border-box}body{background:#f3efe7;color:#24221e;font:16px system-ui;margin:0}main{max-width:850px;margin:auto;padding:24px}section,form,article{background:#fffdf8;padding:18px;border:1px solid #ded5c5;border-radius:10px;margin:12px 0}input,button{font:inherit;padding:10px;border:1px solid #b9aa93;border-radius:6px}input:not([type=checkbox]){width:100%;margin:6px 0 14px}button{background:#24221e;color:white;cursor:pointer;margin:4px}label{display:block}article img{width:80px;height:80px;object-fit:contain;float:left;margin-right:12px}article{overflow:auto} [hidden]{display:none!important}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><main><a href="index.html">Volver al catálogo</a><h1>ROMA MATES · Administración</h1><p id="status" role="status"></p><form id="login"><label>Correo<input id="email" type="email" required></label><label>Contraseña<input id="password" type="password" required></label><button>Ingresar</button></form><div id="panel" hidden><button id="logout">Cerrar sesión</button><form id="editor"><h2 id="heading">Agregar producto</h2><label>Nombre<input id="n" required maxlength="150"></label><label>Categoría<input id="c" required maxlength="80" list="categories"></label><datalist id="categories"></datalist><label>Precio (ej. $25.000)<input id="p" required maxlength="40"></label><label>Foto<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><label><input id="stock" type="checkbox" checked> En stock</label><label><input id="visible" type="checkbox" checked> Visible en catálogo</label><button id="save">Guardar producto</button><button type="button" id="cancel">Cancelar edición</button></form><h2>Productos</h2><div id="list"></div></div></main><script>
const $=id=>document.getElementById(id),db=supabase.createClient(ROMA_CONFIG.url,ROMA_CONFIG.key);let editing=null,items=[];const msg=t=>$('status').textContent=t;function reset(){editing=null;$('editor').reset();$('heading').textContent='Agregar producto'}
async function load(){const {data,error}=await db.from('products').select('*').order('id');if(error){msg(error.message);return}items=data;$('list').replaceChildren();$('categories').replaceChildren();for(const c of new Set(items.map(x=>x.c))){const o=document.createElement('option');o.value=c;$('categories').append(o)}for(const i of items){const a=document.createElement('article'),im=document.createElement('img'),t=document.createElement('div');im.src=i.i;im.alt='';t.textContent=i.n+' · '+i.p+' · '+(i.stock?'En stock':'Sin stock')+' · '+(i.visible?'Visible':'Oculto');const e=document.createElement('button'),d=document.createElement('button');e.textContent='Editar';d.textContent='Eliminar';e.onclick=()=>{editing=i;for(const k of ['n','c','p'])$(k).value=i[k];for(const k of ['stock','visible'])$(k).checked=i[k];$('photo').value='';$('heading').textContent='Editar producto';$('editor').scrollIntoView()};d.onclick=async()=>{if(!confirm('¿Eliminar '+i.n+'?'))return;const {error}=await db.from('products').delete().eq('id',i.id).select('id').single();msg(error?error.message:'Producto eliminado');await load()};a.append(im,t,e,d);$('list').append(a)}}
async function session(){const {data}=await db.auth.getSession();$('login').hidden=!!data.session;$('panel').hidden=!data.session;if(data.session)await load()}
$('login').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';msg(error?error.message:'Sesión iniciada');await session()};$('logout').onclick=async()=>{await db.auth.signOut();reset();$('list').replaceChildren();await session()};$('cancel').onclick=reset;
async function photo(f){if(f.size>15000000)throw Error('Foto demasiado grande (máximo 15 MB)');const b=await createImageBitmap(f),scale=Math.min(1,900/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(b.width*scale));c.height=Math.max(1,Math.round(b.height*scale));c.getContext('2d').drawImage(b,0,0,c.width,c.height);b.close();return c.toDataURL('image/webp',.8)}
$('editor').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{const r={n:$('n').value.trim(),c:$('c').value.trim(),p:$('p').value.trim(),stock:$('stock').checked,visible:$('visible').checked};const f=$('photo').files[0];if(f)r.i=await photo(f);else if(!editing)throw Error('Seleccioná una foto');const query=editing?db.from('products').update(r).eq('id',editing.id):db.from('products').insert(r);const {error}=await query.select('id').single();if(error)throw error;reset();msg('Producto guardado');await load()}catch(e){msg(e.message)}finally{$('save').disabled=false}};session();</script></html>
